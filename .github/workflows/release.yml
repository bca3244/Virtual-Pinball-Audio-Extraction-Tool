name: Release

# Push a tag like v0.1.0 (or v0.1.0-beta.1 for a pre-release) to build the
# Windows exes and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "vp-audio-extract-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/vp-audio-extract.exe, target/release/vp-audio-extract-gui.exe, README.md $name
          Copy-Item LICENSE* $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -Append $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ("${{ github.ref_name }}".Contains("-")) { "--prerelease" } else { $null }
          gh release create "${{ github.ref_name }}" $env:ZIP target/release/vp-audio-extract-gui.exe target/release/vp-audio-extract.exe --title "${{ github.ref_name }}" --generate-notes --target "${{ github.sha }}" $pre
