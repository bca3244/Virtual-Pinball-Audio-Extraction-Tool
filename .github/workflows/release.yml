name: Release

# Push a tag like v0.1.0 (or v0.1.0-beta.1 for a pre-release) to build the
# Windows exes and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --locked
      - name: Package
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $name = "vp-audio-extract-$env:TAG-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/vp-audio-extract.exe, target/release/vp-audio-extract-gui.exe, README.md $name
          Copy-Item LICENSE* $name
          Compress-Archive -Path "$name/*" -DestinationPath "$name.zip"
          "ZIP=$name.zip" | Out-File -Append $env:GITHUB_ENV
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:TAG
          $files = @($env:ZIP, "target/release/vp-audio-extract-gui.exe", "target/release/vp-audio-extract.exe")
          # A release made on GitHub first (which creates the tag) gets the files added.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
          } else {
            $pre = if ($tag.Contains("-")) { "--prerelease" } else { $null }
            gh release create $tag @files --title $tag --generate-notes --verify-tag $pre
          }
