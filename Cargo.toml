[package]
name = "vp-audio-extract"
description = "Records each Visual Pinball table's game music from its PinMAME ROM and installs it as PinUP Popper Audio media."
version = "0.3.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bca3244/Virtual-Pinball-Audio-Extraction-Tool"
build = "build.rs"
exclude = ["assets/icon-source"]

[lib]
path = "src/lib.rs"

[[bin]]
name = "vp-audio-extract"
path = "src/main.rs"

[[bin]]
name = "vp-audio-extract-gui"
path = "src/gui/main.rs"

[dependencies]
anyhow = "1.0.104"
cfb = "0.16.0"
ebur128 = "0.1.11"
clap = { version = "4.6.9", features = ["derive"] }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui_extras = "0.37"
libloading = "0.9.1"
log = "0.4.35"
rfd = "0.17.2"
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha1 = "0.11.0"
simplelog = "0.12.2"

[target.'cfg(windows)'.dependencies]
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3", "vorbis", "wav", "flac"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Media_MediaFoundation",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[build-dependencies]
winresource = "0.1.34"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
